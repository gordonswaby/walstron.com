<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Walstron</title>
<meta name="description" content="Walstron. Something new is coming.">
<meta property="og:title" content="Walstron">
<meta property="og:description" content="Something new is coming.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://walstron.com">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070b14'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='36' fill='%23f5f3ee' text-anchor='middle'%3EW%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --ink: #070b14;
    --paper: #f5f3ee;
    --muted: rgba(245, 243, 238, 0.55);
    --hairline: rgba(245, 243, 238, 0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--paper);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
  }
  .glow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(60% 50% at 50% 110%, rgba(64, 96, 255, 0.16), transparent 70%),
      radial-gradient(40% 35% at 80% -10%, rgba(120, 80, 255, 0.10), transparent 70%);
  }
  main {
    position: relative;
    padding: 2rem;
    animation: rise 1.2s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  h1 {
    font-size: clamp(2.4rem, 8vw, 4.5rem);
    font-weight: 300;
    letter-spacing: 0.32em;
    text-indent: 0.32em; /* balances the letter-spacing on the last glyph */
    text-transform: uppercase;
  }
  .rule {
    width: 56px;
    height: 1px;
    background: var(--hairline);
    margin: 2rem auto;
  }
  p.tag {
    font-size: clamp(0.85rem, 2.5vw, 1rem);
    letter-spacing: 0.28em;
    text-indent: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
  }
  footer {
    position: fixed;
    bottom: 1.5rem;
    left: 0;
    right: 0;
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    color: rgba(245, 243, 238, 0.3);
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <main>
    <h1>Walstron</h1>
    <div class="rule"></div>
    <p class="tag">Coming soon</p>
  </main>
  <footer>&copy; 2026 Walstron. All rights reserved.</footer>
</body>
</html>
