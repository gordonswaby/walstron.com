<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Walstron</title>
<meta name="description" content="Walstron Limited. Kingston, Jamaica. Coming soon.">
<meta name="theme-color" content="#0A0A0A">
<meta property="og:title" content="Walstron">
<meta property="og:description" content="Walstron Limited. Kingston, Jamaica. Coming soon.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://walstron.com">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230A0A0A'/%3E%3Ctext x='27' y='47' font-family='Inter,-apple-system,BlinkMacSystemFont,sans-serif' font-size='42' font-weight='600' fill='%23FAFAFA' text-anchor='middle'%3Ew%3C/text%3E%3Ctext x='41' y='47' font-family='Inter,-apple-system,BlinkMacSystemFont,sans-serif' font-size='42' font-weight='600' fill='%238B6F47'%3E.%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Palette: Ink, Paper, Fog, Bronze. Bronze appears once, as the period. */
  :root {
    --ink: #0A0A0A;
    --paper: #FAFAFA;
    --fog: #6B6B6B;
    --bronze: #8B6F47;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--paper);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  ::selection { background: var(--bronze); color: var(--paper); }

  h1.wordmark {
    font-size: clamp(2.75rem, 11vw, 5.5rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1;
    color: var(--paper);
  }
  .wordmark span {
    display: inline-block;
    opacity: 0;
    transform: translateY(0.3em);
    animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
  }
  .wordmark span:nth-child(1) { animation-delay: 0.15s; }
  .wordmark span:nth-child(2) { animation-delay: 0.21s; }
  .wordmark span:nth-child(3) { animation-delay: 0.27s; }
  .wordmark span:nth-child(4) { animation-delay: 0.33s; }
  .wordmark span:nth-child(5) { animation-delay: 0.39s; }
  .wordmark span:nth-child(6) { animation-delay: 0.45s; }
  .wordmark span:nth-child(7) { animation-delay: 0.51s; }
  .wordmark span:nth-child(8) { animation-delay: 0.57s; }
  .wordmark span.period {
    color: var(--bronze);
    transform: none;
    animation: land 0.5s cubic-bezier(0.2, 0.7, 0.2, 1) 1.05s forwards;
  }
  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes land {
    from { opacity: 0; transform: scale(0.4); }
    to   { opacity: 1; transform: scale(1); }
  }

  .pillars {
    margin-top: 3.2rem;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: clamp(1.4rem, 6vw, 3rem);
  }
  .pillar {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
    color: var(--fog);
    opacity: 0;
    animation: fade 0.9s ease forwards;
    transition: color 0.35s ease;
  }
  .pillar:hover { color: var(--paper); }
  .pillar:nth-child(1) { animation-delay: 1.55s; }
  .pillar:nth-child(2) { animation-delay: 1.7s; }
  .pillar:nth-child(3) { animation-delay: 1.85s; }
  .pillar:nth-child(4) { animation-delay: 2s; }
  .pillar svg {
    width: 32px;
    height: 32px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .pillar span {
    font-size: 0.55rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-indent: 0.18em;
    text-transform: uppercase;
  }

  p.soon {
    margin-top: 3rem;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.25em;
    text-indent: 0.25em;
    text-transform: uppercase;
    color: var(--fog);
    opacity: 0;
    animation: fade 0.9s ease 2.5s forwards;
  }
  @keyframes fade { to { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .wordmark span, p.soon, .pillar {
      animation: none;
      opacity: 1;
      transform: none;
    }
  }
</style>
</head>
<body>
  <main>
    <h1 class="wordmark" aria-label="walstron.">
      <span aria-hidden="true">w</span><span aria-hidden="true">a</span><span aria-hidden="true">l</span><span aria-hidden="true">s</span><span aria-hidden="true">t</span><span aria-hidden="true">r</span><span aria-hidden="true">o</span><span aria-hidden="true">n</span><span class="period" aria-hidden="true">.</span>
    </h1>
    <div class="pillars" role="list" aria-label="Operating areas">
      <div class="pillar" role="listitem">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 8 26.5 14 16 20 5.5 14Z"/>
          <path d="M26.5 14v7"/>
        </svg>
        <span>EdTech</span>
      </div>
      <div class="pillar" role="listitem">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="8.5" r="2.1"/>
          <circle cx="9" cy="21" r="2.1"/>
          <circle cx="23" cy="21" r="2.1"/>
          <path d="M14.39 11.38 10.61 18.12M17.61 11.38 21.39 18.12M12.3 21h7.4"/>
        </svg>
        <span>Technology</span>
      </div>
      <div class="pillar" role="listitem">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <path d="M9 14a7 7 0 0 1 14 0"/>
          <path d="M20.8 12 23 14l2.2-2"/>
          <path d="M23 18a7 7 0 0 1-14 0"/>
          <path d="M11.2 20 9 18l-2.2 2"/>
        </svg>
        <span>Commerce</span>
      </div>
      <div class="pillar" role="listitem">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <path d="M5.5 25h21"/>
          <path d="M8 25v-9h5.5v9"/>
          <path d="M15.5 25V8.5H24V25"/>
        </svg>
        <span>Real Estate</span>
      </div>
    </div>
    <p class="soon">Coming soon</p>
  </main>
</body>
</html>
